<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    
    <style>
      .ref-axis { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 6; }
      .plane-axis { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .orbit-ring { fill: none; stroke: #0f172a; stroke-width: 2.2; }
      .radius-line { stroke: #334155; stroke-width: 1.6; stroke-dasharray: 3 3; }
      .arc-angle { fill: none; stroke: #dc2626; stroke-width: 2; }
      .lbl-red { font-family: 'Times New Roman', Times, serif; font-size: 26px; font-weight: bold; font-style: italic; fill: #dc2626; }
      .lbl-dark { font-family: 'Times New Roman', Times, serif; font-size: 22px; font-style: italic; fill: #0f172a; }
      .lbl-axis { font-family: 'Times New Roman', Times, serif; font-size: 22px; font-style: italic; fill: #334155; }
      .mass-bob { fill: #0f172a; stroke: #dc2626; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ==================== REFERENCE INERTIAL AXES ==================== -->
  <!-- Vertical Z Axis -->
  <line x1="450" y1="35" x2="450" y2="710" class="ref-axis" />
  <text x="462" y="55" class="lbl-axis">Z</text>

  <!-- Horizontal Reference Node Axis -->
  <line x1="50" y1="370" x2="810" y2="370" class="ref-axis" />
  <text x="825" y="376" class="lbl-axis">X / Y<tspan font-size="14" dy="4">node</tspan></text>

  <!-- ==================== ORBITAL PLANES (ELLIPSES) ==================== -->
  <!-- 1. Steep Tilted Orbit (Body 1) -->
  <g transform="rotate(-68 450 370)">
    <ellipse cx="450" cy="370" rx="330" ry="65" class="orbit-ring" />
  </g>

  <!-- 2. Lower-Right Tilted Orbit (Body 2) -->
  <g transform="rotate(22 450 370)">
    <ellipse cx="450" cy="370" rx="340" ry="62" class="orbit-ring" />
  </g>

  <!-- 3. Lower-Left Tilted Orbit (Body 3) -->
  <g transform="rotate(162 450 370)">
    <ellipse cx="450" cy="370" rx="330" ry="58" class="orbit-ring" />
  </g>

  <!-- ==================== MAJOR AXES (DASHED DATUMS) ==================== -->
  <!-- Steep Plane Major Axis (-68 deg) -->
  <line x1="326" y1="676" x2="574" y2="64" class="plane-axis" />

  <!-- Lower-Right Plane Major Axis (+22 deg) -->
  <line x1="135" y1="243" x2="765" y2="497" class="plane-axis" />

  <!-- Lower-Left Plane Major Axis (162 deg) -->
  <line x1="764" y1="268" x2="136" y2="472" class="plane-axis" />

  <!-- Origin Marker O -->
  <circle cx="450" cy="370" r="4.5" fill="#0f172a" />
  <text x="428" y="392" class="lbl-dark">O</text>

  <!-- ==================== RADIUS VECTORS & MASSES ON ORBIT PATHS ==================== -->
  <!-- Mass 1 (Exactly on Ellipse 1 perimeter at u=233.3, v=46.0 -> (580, 171)) -->
  <line x1="450" y1="370" x2="580" y2="171" class="radius-line" marker-end="url(#arrow-dark)" />
  <circle cx="580" cy="171" r="9" class="mass-bob" />
  <text x="602" y="165" class="lbl-dark">m₁</text>

  <!-- Mass 2 (Exactly on Ellipse 2 perimeter at u=240.4, v=43.8 -> (656, 501)) -->
  <line x1="450" y1="370" x2="656" y2="501" class="radius-line" marker-end="url(#arrow-dark)" />
  <circle cx="656" cy="501" r="9" class="mass-bob" />
  <text x="680" y="515" class="lbl-dark">m₂</text>

  <!-- Mass 3 (Exactly on Ellipse 3 perimeter at u=233.3, v=-41.0 -> (241, 481)) -->
  <line x1="450" y1="370" x2="241" y2="481" class="radius-line" marker-end="url(#arrow-dark)" />
  <circle cx="241" cy="481" r="9" class="mass-bob" />
  <text x="202" y="495" class="lbl-dark">m₃</text>

  <!-- ==================== INCLINATION TILT ARCS (α) ==================== -->
  <!-- α₂ Arc: Vertical Z-axis to Steep Plane Major Axis -->
  <path d="M 450 200 A 170 170 0 0 1 514 212" class="arc-angle" marker-end="url(#arrow-red)" />
  <text x="478" y="185" class="lbl-red">α₂</text>

  <!-- α₁ Arc: Horizontal Reference to Lower-Right Major Axis -->
  <path d="M 630 370 A 180 180 0 0 1 617 437" class="arc-angle" marker-end="url(#arrow-red)" />
  <text x="645" y="415" class="lbl-red">α₁</text>

  <!-- α₃ Arc: Negative Horizontal to Lower-Left Major Axis -->
  <path d="M 280 370 A 170 170 0 0 0 288 423" class="arc-angle" marker-end="url(#arrow-red)" />
  <text x="255" y="410" class="lbl-red">α₃</text>

  <!-- ==================== ORBITAL SWEEP ARCS (φ) ==================== -->
  <!-- φ₂ Arc: Steep Axis to m₁ Radius Line (Terminates on m₁) -->
  <path d="M 532 166 A 220 220 0 0 1 571 186" class="arc-angle" marker-end="url(#arrow-red)" />
  <text x="555" y="155" class="lbl-red">φ₂</text>

  <!-- φ₁ Arc: Lower-Right Axis to m₂ Radius Line (Terminates on m₂) -->
  <path d="M 659 454 A 225 225 0 0 1 640 491" class="arc-angle" marker-end="url(#arrow-red)" />
  <text x="672" y="480" class="lbl-red">φ₁</text>

  <!-- φ₃ Arc: Lower-Left Axis to m₃ Radius Line (Terminates on m₃) -->
  <path d="M 241 438 A 220 220 0 0 0 256 473" class="arc-angle" marker-end="url(#arrow-red)" />
  <text x="222" y="460" class="lbl-red">φ₃</text>
</svg>
